version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    # TypeScript 6 currently fails tsup's declaration build on its baseUrl
    # deprecation, while typescript-eslint 8 supports only TypeScript <6.1.
    # Revisit this alongside tsup and typescript-eslint updates.
    ignore:
      - dependency-name: typescript
        versions: [">=6"]
    commit-message:
      prefix: build
      include: scope
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patches:
        dependency-type: production
        update-types: [patch]

  # Workflows use immutable commit SHAs. Dependabot is the reviewable path
  # that moves those pins and updates their version comments.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
