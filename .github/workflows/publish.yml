name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v0.2.0)
        required: true

concurrency:
  group: publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag must be a semver tag beginning with v"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Tag agrees with package version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          if [[ "v$package_version" != "$RELEASE_TAG" ]]; then
            echo "::error::tag $RELEASE_TAG does not match package.json version $package_version"
            exit 1
          fi

      # No install lifecycle scripts are needed by this project. Keeping them
      # disabled limits what a compromised transitive package can execute.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:package
      - run: npm audit --audit-level=high

      - name: Pack the exact artifact to publish
        shell: bash
        run: |
          mkdir release
          npm pack --pack-destination release

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: npm-package-${{ steps.release.outputs.tag }}
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/metaplate
    permissions:
      contents: read
      id-token: write
    steps:
      # This job never checks out or installs repository dependencies. It
      # receives the already-verified tarball, reducing the code that runs
      # alongside npm publishing credentials and the provenance token.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-package-${{ needs.verify.outputs.tag }}
          path: release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check for an existing identical publication
        id: registry
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          archive=$(find release -maxdepth 1 -name '*.tgz' -print -quit)
          local_integrity=$(node -e \
            "const fs=require('node:fs'),c=require('node:crypto'); const b=fs.readFileSync(process.argv[1]); process.stdout.write('sha512-'+c.createHash('sha512').update(b).digest('base64'))" \
            "$archive")
          # `npm view --json` writes an E404 object to stdout, so treating a
          # non-empty string as a published version misclassifies the first
          # release. Test the command status and request the plain value.
          if ! remote_integrity=$(npm view "metaplate@$VERSION" dist.integrity 2>/dev/null); then
            remote_integrity=""
          fi
          if [[ -z "$remote_integrity" ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif [[ "$remote_integrity" == "$local_integrity" ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "metaplate@$VERSION is already published with the verified artifact."
          else
            echo "::error::metaplate@$VERSION exists, but its integrity differs from the verified artifact"
            exit 1
          fi

      - name: Publish verified tarball
        if: steps.registry.outputs.published != 'true'
        run: npm publish release/*.tgz --access public --provenance --tag "${{ needs.verify.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
